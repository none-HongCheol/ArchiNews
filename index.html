<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>건축·건설 데일리 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 사내 조간 브리핑 — 담백하고 빠르게 훑는 신문 1면
   IDEA: 경제지 산업면 + 홈(1면 요약) + 지난 호 보관함 + 원문 열람 창
   PICTURE: 홈의 오늘 핵심 + 숫자 패널, 분야별 칸, AA아키그룹 박스
   COLOUR and TYPE: 흰 바탕, 잉크 #121212, 레드 #e3120b, 슬레이트 #2e6f8e / Noto Serif KR + Noto Sans KR
   LAYOUT: 마스트헤드(홈/오늘/지난 탭) → 보기별 본문 → 오른쪽에서 열리는 원문 창 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#10191e);--ink:light-dark(#121212,#eef2f4);--mute:light-dark(#5b6670,#9fb0ba);
--rule:light-dark(#121212,#d9e2e7);--hair:light-dark(#d6dde1,#2a3a44);--red:#e3120b;--slate:light-dark(#2e6f8e,#7fb6d1);
--panel:light-dark(#e3ecf0,#182a33);--aa:light-dark(#2e6f8e,#1d4a60)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all}
body.reading{overflow:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
a{color:inherit}
.mast{border-bottom:3px solid var(--rule);padding:22px 0 14px}
.mrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tab{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:4px 10px}
.views{display:flex;flex-wrap:wrap;gap:6px}
.views a,.nav button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--hair);text-decoration:none;font:500 15px "Noto Sans KR",sans-serif;background:transparent;color:var(--ink);cursor:pointer}
.views a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.mast h1{font:700 clamp(32px,5vw,50px)/1.05 "Noto Serif KR",serif;margin:0;text-wrap:balance}
.mast h1 a{text-decoration:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;color:var(--mute);font-size:14px;margin-top:10px}
.nav{display:flex;gap:6px;margin-left:auto}
.credit{color:var(--mute);font-size:13px;letter-spacing:.02em}
h2{font:700 22px/1.3 "Noto Serif KR",serif;margin:0 0 12px}
.lbl{font-size:14px;color:var(--mute)}
.msg{padding:30px 0;color:var(--mute)}
/* 오늘의 핵심 + 숫자 */
.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;padding:26px 0;border-bottom:1px solid var(--rule)}
.key{margin:0;padding:0;list-style:none;counter-reset:k}
.key li{position:relative;padding:12px 0 12px 34px;border-top:1px solid var(--hair);font-size:17px}
.key li::before{counter-increment:k;content:counter(k);position:absolute;left:0;top:12px;font:700 20px/1.3 "Noto Serif KR",serif;color:var(--red)}
.nums{background:var(--panel);padding:22px}
.big{font:700 clamp(40px,6vw,56px)/1 "Noto Serif KR",serif;white-space:nowrap}
.big small{font-size:20px;margin-left:6px}
.up{color:var(--red);font-weight:700;white-space:nowrap}
.gauge{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
.track{position:relative;height:14px;background:light-dark(#fff,#0c1418);border:1px solid var(--hair);margin:30px 0 6px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--slate)}
.base{position:absolute;top:-8px;bottom:-8px;right:0;border-right:2px solid var(--ink)}
.pin{position:absolute;top:-28px;transform:translateX(-50%);font-weight:700;font-size:15px;white-space:nowrap}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.more{display:inline-flex;margin-top:14px;font-weight:700;color:var(--red);text-decoration:none;min-height:44px;align-items:center}
.more:hover{text-decoration:underline}
/* AA 박스 */
.aa{margin:26px 0 6px;border:2px solid var(--aa);display:grid;grid-template-columns:220px minmax(0,1fr)}
.aa .hd{background:var(--aa);color:#fff;padding:20px}
.aa .hd b{display:block;font:700 22px/1.25 "Noto Serif KR",serif;margin-bottom:6px}
.aa .hd span{font-size:14px;opacity:.85}
.aa .bd{padding:16px 22px}
.aa .none{font-weight:500;margin:0 0 10px}
.aa ul{list-style:none;margin:0;padding:0}
.aa li{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:15px}
.aa li time{color:var(--mute);white-space:nowrap}
.aa .sig{margin:10px 0 0;padding:10px 12px;background:var(--panel);font-size:15px}
/* 홈 */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:26px 0;border-bottom:1px solid var(--hair)}
.cat{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--hair);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-height:120px}
.cat:hover{border-color:var(--ink)}
.cat b{font:700 17px/1.3 "Noto Serif KR",serif}
.cat .n{font:700 30px/1 "Noto Serif KR",serif;color:var(--slate)}
.cat .t{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent{padding:26px 0;border-bottom:3px solid var(--rule)}
/* 분야 필터 + 기사 */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--bg);z-index:2}
.filters button{font:500 15px "Noto Sans KR",sans-serif;min-height:44px;padding:0 16px;border:1px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.grid.one{grid-template-columns:minmax(0,1fr)}
.sec{padding:24px 0;border-bottom:1px solid var(--hair)}
.sec h2{display:flex;align-items:baseline;gap:10px}
.sec h2 span{font:500 14px "Noto Sans KR",sans-serif;color:var(--mute)}
.item{padding:14px 10px;margin:0 -10px;border-top:1px solid var(--hair);cursor:pointer}
.item:hover{background:var(--panel)}
.item h3 a{text-decoration:none}
.item:hover h3 a{text-decoration:underline}
.item h3{font:700 18px/1.4 "Noto Serif KR",serif;margin:0 0 6px}
.item p{margin:0 0 8px}
.src{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.src a,.aa a,.arc a.lnk{color:var(--slate);text-underline-offset:3px}
.cal{padding:24px 0;border-bottom:3px solid var(--rule)}
.cal table{width:100%;border-collapse:collapse}
.cal td{padding:10px 8px;border-top:1px solid var(--hair);vertical-align:top}
.cal td:first-child{white-space:nowrap;font-weight:700;width:7em}
/* AA 소식 탭 */
.aav{padding:24px 0 30px;border-bottom:3px solid var(--rule)}
.aav .list{list-style:none;margin:0;padding:0}
.aav .list li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--hair)}
.aav .list time{font-weight:700;white-space:nowrap}
.aav .list b{display:block;font:700 17px/1.4 "Noto Serif KR",serif}
.aav .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0;border-bottom:1px solid var(--hair)}
/* 프로젝트 서울 탭 */
.psv{padding:24px 0 30px;border-bottom:3px solid var(--rule)}
.psv h3{font:700 19px/1.3 "Noto Serif KR",serif;margin:26px 0 8px}
.psv .links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.nl{list-style:none;margin:0;padding:0}
.nl a{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--hair);text-decoration:none;color:var(--ink)}
.nl a:hover b{text-decoration:underline}
.nl time{color:var(--mute);white-space:nowrap}
.nl small{display:block;color:var(--slate);font-size:13px}
.arcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.arcg a{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--hair);text-decoration:none;color:var(--ink)}
.arcg a:hover{border-color:var(--ink)}
.arcg .st{font-size:12px;font-weight:700;color:var(--red)}
.arcg b{font:700 16px/1.35 "Noto Serif KR",serif}
.arcg span{font-size:13px;color:var(--mute)}
.arcg.res a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.arcg.res img,.arcg.res i{width:96px;height:68px;object-fit:cover;background:var(--panel);display:block}
.arcg.res .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.arcg.res b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 홈: 신문 1면 (큰 화면에서는 한 화면에 맞춤) */
.front{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:30px;padding:18px 0 22px}
.front h3{font:700 18px/1.3 "Noto Serif KR",serif;margin:0 0 4px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.fmain{display:flex;flex-direction:column;gap:16px;min-height:0}
.flead{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;border-bottom:1px solid var(--rule);padding-bottom:16px}
.fleadL{display:flex;flex-direction:column;gap:8px}
.fkick{color:var(--red);font-weight:700;font-size:14px}
.fH{font:700 clamp(26px,2.2vw,38px)/1.25 "Noto Serif KR",serif;display:block}
.fleadP{margin:0;font-size:16px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fsrc{font-size:13px;color:var(--mute)}
.fkey{display:flex;flex-direction:column;border-left:1px solid var(--hair);padding-left:24px}
.fkey>b{font:700 18px "Noto Serif KR",serif;padding-bottom:6px}
.fkey p{margin:0;padding:8px 0;border-top:1px solid var(--hair);font-size:15px;line-height:1.5}
.fkey .n{color:var(--red)}
.fmore{margin-top:auto;padding-top:8px;font-size:14px;font-weight:700;color:var(--red);text-decoration:none}
.fmore:hover{text-decoration:underline}
.fcols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.fcol{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.ftop{display:flex;flex-direction:column;gap:6px}
.fh{font:700 16px/1.4 "Noto Serif KR",serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fsum{margin:0;font-size:13px;line-height:1.55;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.45;padding-top:8px;border-top:1px solid var(--hair)}
.front a.orig{text-decoration:none;color:var(--ink)}
.front a.orig:hover .fH,.front a.orig:hover .fh,.front a.orig:hover .fl,.front a.orig:hover .fk{text-decoration:underline}
.fkc{font-size:11.5px;color:var(--mute);white-space:nowrap;margin-left:4px}
.fnone{margin:0;font-size:14px;color:var(--mute)}
.fside{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--rule);padding-left:28px;min-height:0;overflow:hidden}
.faa{background:var(--aa);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.faa b{font:700 18px "Noto Serif KR",serif}.faa span{font-size:15px}
.faa a{color:#fff}.faa .fmore{color:#fff;margin-top:4px}
.fps{display:block;font-size:15px;line-height:1.45;padding:8px 0;border-top:1px solid var(--hair);text-decoration:none;color:var(--ink)}
.fps:first-of-type{border-top:0}
.fps small{display:block;font-size:12px;color:var(--slate)}
.fps:hover{text-decoration:underline}
.fcal{margin:0;font-size:15px;line-height:1.5}
@media(min-width:1500px) and (min-height:700px){
 body.fit .wrap{max-width:none;height:100vh;display:flex;flex-direction:column;padding:0 40px}
 body.fit .mast{padding:14px 0 10px}
 body.fit .mast h1{font-size:38px}
 body.fit .mrow{margin-bottom:6px}
 body.fit main{flex:1;min-height:0;overflow:hidden}
 body.fit .front{height:100%;box-sizing:border-box}
 body.fit .foot{display:none}
 /* 나머지 탭도 한 화면: 화면은 고정, 긴 목록만 칸 안에서 스크롤 */
 body.fit .pane{overflow:auto;min-height:0;scrollbar-width:thin;overscroll-behavior:contain}
 body.fit .dv{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr);gap:36px;padding-top:14px}
 body.fit .dvL{padding-right:10px}
 body.fit .dvL .top{grid-template-columns:minmax(0,1fr);gap:18px;padding:0 0 18px}
 body.fit .dvL .key li{font-size:15.5px;padding:9px 0 9px 30px}
 body.fit .dvL .key li::before{top:9px;font-size:18px}
 body.fit .dvL .aa{grid-template-columns:minmax(0,1fr);margin:16px 0 0}
 body.fit .dvL .aa .hd{padding:12px 16px}
 body.fit .dvL .cal{border-bottom:0}
 body.fit .dvR{padding-right:10px}
 body.fit .dvR .filters{padding:0 0 12px}
 body.fit .dvR .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 30px}
 body.fit .dvR .grid.one{grid-template-columns:repeat(2,minmax(0,1fr))}
 body.fit .dvR .grid.one .sec{grid-column:1/-1}
 body.fit .dvR .sec{padding:14px 0}
 body.fit .dvR .item h3{font-size:16.5px}
 body.fit .dvR .item p{font-size:14.5px;line-height:1.6}
 body.fit .aav,body.fit .psv,body.fit .arc{height:100%;display:flex;flex-direction:column;padding:16px 0 0;border-bottom:0}
 body.fit .aav .list{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;align-content:start}
 body.fit .psg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:36px;margin-top:8px}
 body.fit .psg h3{margin-top:4px;position:sticky;top:0;background:var(--bg);padding-bottom:6px;z-index:1}
 body.fit .psg .pane{padding-right:10px}
 body.fit .psv .arcg{grid-template-columns:repeat(3,minmax(0,1fr))}
 body.fit .arcl{flex:1;columns:2;column-gap:48px}
 body.fit .arcl .mon{column-span:all;break-after:avoid;margin:14px 0 6px}
 body.fit .arcl .mon:first-child{margin-top:0}
 body.fit .arcl .day{break-inside:avoid}
}
@media(min-width:1500px) and (min-height:700px){
 /* 오늘 브리핑: 기사는 3단 신문식으로 채우고 요약은 3줄까지 */
 body.fit .dvR .grid{display:block;columns:3;column-gap:30px}
 body.fit .dvR .grid.one{columns:2}
 body.fit .dvR .sec{break-inside:auto;padding:0 0 14px}
 body.fit .dvR .sec h2{break-after:avoid;font-size:20px;margin-bottom:6px}
 body.fit .dvR .item{break-inside:avoid;padding:10px}
 body.fit .dvR .item p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
 body.fit .dvL .top{gap:12px;padding-bottom:12px}
 body.fit .dvL h2{font-size:20px;margin-bottom:6px}
 body.fit .dvL .key li{font-size:15px;line-height:1.55;padding:7px 0 7px 28px}
 body.fit .dvL .key li::before{top:7px}
 body.fit .dvL .nums{padding:12px 16px}
 body.fit .dvL .big{font-size:38px}
 body.fit .dvL .gauge{margin-top:8px;padding-top:8px}
 body.fit .dvL .track{margin:24px 0 4px}
 body.fit .dvL .aa{margin-top:12px}
 body.fit .dvL .aa .bd{padding:10px 16px}
 body.fit .dvL .cal{padding:12px 0 0}
 body.fit .dvL .cal td{padding:6px;font-size:14.5px;line-height:1.5}
 /* 프로젝트 서울: 공모알림 2단, 아카이브 2열 */
 body.fit .psg{grid-template-columns:minmax(0,1.3fr) minmax(0,1.15fr)}
 body.fit .psg h3{margin-bottom:4px}
 body.fit .psg .nl{columns:2;column-gap:28px}
 body.fit .psg .nl li{break-inside:avoid}
 body.fit .psg .nl a{grid-template-columns:5.6em minmax(0,1fr);gap:8px;padding:7px 0;font-size:14.5px;line-height:1.45}
 body.fit .psg .nl small{font-size:12px}
 body.fit .psv .arcg{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 body.fit .psv .arcg a{padding:8px 12px;gap:2px;line-height:1.4}
 body.fit .psv .arcg b{font-size:15px}
 body.fit .psv .arcg span{font-size:12.5px}
 body.fit .psv .links{margin:8px 0 0}
 body.fit .psv>.lbl{margin:0}
}
@media(max-width:1499px){.fcols{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.front{grid-template-columns:minmax(0,1fr)}.fside{border-left:0;padding-left:0}.fcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.flead{grid-template-columns:minmax(0,1fr)}.fkey{border-left:0;padding-left:0}.fcols{grid-template-columns:minmax(0,1fr)}}
/* 지난 브리핑 */
.arc{padding:24px 0 30px;border-bottom:3px solid var(--rule)}
.arc .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.arc input{font:16px "Noto Sans KR",sans-serif;min-height:44px;padding:0 12px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);width:min(100%,360px)}
.mon{font:700 18px "Noto Serif KR",serif;margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.day{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--hair);text-decoration:none}
.day:hover .h{text-decoration:underline}
.day .d{font-weight:700;white-space:nowrap;color:var(--ink)}
.day .h{color:var(--ink)}
.day .n{font-size:13px;color:var(--mute);white-space:nowrap}
.day .n b{color:var(--slate)}
/* 원문 열람 창 */
.reader{position:fixed;inset:0;z-index:20;display:none}
.reader.open{display:block}
.reader .dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.reader .box{position:absolute;top:0;right:0;bottom:0;width:min(980px,92vw);background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.reader .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:3px solid var(--rule)}
.reader .bar .ttl{flex:1 1 240px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader .bar .ttl small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.reader .btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reader .note{margin:0;padding:8px 14px;font-size:13px;color:var(--mute);background:var(--panel)}
.reader iframe{flex:1;width:100%;border:0;background:#fff}
.foot{padding:18px 0 40px;font-size:13px;color:var(--mute)}
@media(max-width:860px){.top,.grid{grid-template-columns:minmax(0,1fr)}.aa{grid-template-columns:minmax(0,1fr)}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.aav .list li{grid-template-columns:minmax(0,1fr);gap:2px}.arcg{grid-template-columns:minmax(0,1fr)}.nl a{grid-template-columns:minmax(0,1fr);gap:2px}}

<body>
<div class="wrap">
<header class="mast">
<div class="mrow">

<h1><a href="#home">건축·건설 데일리 브리핑</a></h1>
<div class="meta"><span id="dateLine">불러오는 중…</span><span>매일 오전 7시 30분 발행</span><span class="credit">창간 이라엽 · 복간 김홍철 · 집필 AI</span>

요약은 원문을 읽고 새로 쓴 것입니다. 기사 원문은 각 언론사에 저작권이 있으므로 링크로 확인하고, 본문을 복사해 재배포하지 마세요.

<script>
{
const CATS=[["all","전체"],["design","설계·정비사업"],["seoul","서울시 설계공모"],["build","시공 수주"],["public","공공 발주"],["market","경기 지표"],["biz","업계·금융"]];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const url=v=>/^https?:\/\//.test(String(v))?esc(v):"#";
const main=document.getElementById("main"),dl=document.getElementById("dateLine"),dnav=document.getElementById("dnav");
const prev=document.getElementById("prev"),next=document.getElementById("next");
let IDX=[],cache={},cur="all",shown=null;
/* 사이트 안에서 열리지 않게 막아 둔 언론사(매일 아침 확인) → 이 언론사 기사는 바로 새 탭으로 엽니다 */
let BLOCKED=new Set();
fetch("data/noframe.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(j=>{BLOCKED=new Set(j.blocked||[])}).catch(()=>{});
const noFrame=u=>{try{const h=new URL(u).hostname;return BLOCKED.has(h)}catch(e){return false}};
try{const v=localStorage.getItem("brief-cat");if(v&&CATS.some(c=>c[0]===v))cur=v}catch(e){}
const fmt=(d,w)=>{const [y,m,dd]=d.split("-");return `${y}년 ${+m}월 ${+dd}일${w?` (${w})`:""}`};
const getDay=async d=>{if(cache[d])return cache[d];const r=await fetch(`data/${d}.json`,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return cache[d]=await r.json()};
const orig=(u,src,ttl,label="원문")=>`<a class="orig" href="${url(u)}" target="_blank" rel="noopener" data-src="${esc(src)}" data-ttl="${esc(ttl)}">${label}</a>`;

/* ---------- 공통 조각 ---------- */
function keyHTML(D){return `<ol class="key">${(D.key||[]).map(k=>`<li><b>${esc(k.b)}</b> ${esc(k.t)}</li>`).join("")}</ol>`}
function numsHTML(D){
 const F=D.figure,G=D.gauge;if(!F)return"";
 const gv=Math.min(100,+(G&&G.value)||0);
 const g=G?`<div class="gauge"><div class="lbl">${esc(G.label)}</div><div class="track" role="img" aria-label="${esc(G.value)}"><div class="fill" style="width:${gv}%"></div><div class="pin" style="left:${gv}%">${esc(G.value)}</div><div class="base"></div></div><div class="scale"><span>0</span><span>기준선 100</span></div><div class="lbl" style="margin-top:8px">${esc(G.note)}</div></div>`:"";
 return `<aside class="nums" aria-label="오늘의 숫자"><div class="lbl">${esc(F.label)}</div><div class="big">${esc(F.value)}<small>${esc(F.unit)}</small></div><div><span class="up">${esc(F.change)}</span> <span class="lbl">· ${esc(F.note)}</span></div>${g}</aside>`;
}
function aaHTML(D){
 const A=D.aa||{},today=A.today||[];
 return `<section class="aa"><div class="hd"><b>AA아키그룹 소식</b><span>우리 회사 관련 보도</span></div><div class="bd">
  ${today.length?`<ul>${today.map(x=>`<li><time>${esc(x.d)}</time><span>${esc(x.t)}${x.p?` — ${esc(x.p)}`:""} ${orig(x.u,"AA아키그룹 관련 보도",x.t)}</span></li>`).join("")}</ul>`:`<p class="none">오늘은 새로 보도된 소식이 없습니다.</p>`}
  ${(A.recent||[]).length?`<div class="lbl" style="margin-top:12px">최근 보도</div><ul>${A.recent.map(x=>`<li><time>${esc(x.d)}</time><span>${esc(x.t)} ${orig(x.u,"AA아키그룹 관련 보도",x.t,"보기")}</span></li>`).join("")}</ul>`:""}
  ${A.signal?`<p class="sig"><b>관련 시장 신호</b> · ${esc(A.signal)}</p>`:""}
 </div></section>`;
}
function newsHTML(D){
 const cats=CATS.slice(1).filter(([k])=>cur==="all"||k===cur);
 const html=cats.map(([k,n])=>{const its=(D.news||[]).filter(x=>x.c===k);if(!its.length)return"";
  return `<section class="sec"><h2>${n}<span>${its.length}건</span></h2>${its.map(x=>`<article class="item"><h3>${x.s&&x.s[0]?orig(x.s[0][2],x.s[0][0],x.t,esc(x.t)):esc(x.t)}</h3><p>${esc(x.p)}</p><div class="src">${(x.s||[]).map(s=>`<span>${esc(s[0])} · ${esc(s[1])} · ${orig(s[2],s[0],x.t)}</span>`).join("")}</div></article>`).join("")}</section>`}).join("");
 return html||`<p class="msg">이 분야의 기사가 없습니다.</p>`;
}
function filtersHTML(D){return CATS.map(([k,n])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${n}${k==="all"?"":" "+(D.news||[]).filter(x=>x.c===k).length}</button>`).join("")}
function dayRow(x){return `<a class="day" href="#d-${esc(x.date)}"><span class="d">${esc(fmt(x.date,x.weekday))}</span><span class="h">${esc(x.head)}</span><span class="n">기사 ${esc(x.count)}건${x.aa?` · <b>AA 소식 ${esc(x.aa)}건</b>`:""}</span></a>`}

/* ---------- 홈 ---------- */
async function homeView(){
 dnav.style.display="none";
 const latest=IDX[0];
 if(!latest){main.innerHTML=`<p class="msg">아직 발행된 브리핑이 없습니다.</p>`;dl.textContent="";return}
 let D;try{D=await getDay(latest.date)}catch(e){main.innerHTML=`<p class="msg">최신 브리핑을 불러오지 못했습니다.</p>`;return}
 let P={};try{const r=await fetch("data/project_seoul.json",{cache:"no-store"});if(r.ok)P=await r.json()}catch(e){}
 dl.textContent=fmt(D.date,D.weekday);
 const news=D.news||[];
 /* 머리기사: 핵심 1번과 가장 많이 겹치는 기사 */
 const words=t=>new Set(String(t||"").replace(/[^\p{L}\p{N}]+/gu," ").split(" ").filter(w=>w.length>1));
 const k0=words((D.key&&D.key[0]&&D.key[0].b)||"");
 let lead=news[0],best=-1;news.forEach(n=>{let c=0;words(n.t).forEach(w=>{if(k0.has(w))c++});if(c>best){best=c;lead=n}});
 /* 핵심 뉴스: 머리기사를 뺀 실제 기사 3건. AI 핵심 정리와 가장 닮은 기사를 먼저, 모자라면 분야별 첫 기사 */
 const sim=(x,y)=>{const a=words(x);let c=0;words(y).forEach(w=>{if(a.has(w))c++});return c};
 const picks=[];
 const okPick=n=>n&&n!==lead&&!picks.includes(n)&&sim(lead.t,n.t)<3&&!picks.some(p=>sim(p.t,n.t)>=3);
 (D.key||[]).forEach(k=>{if(picks.length>=3||sim(k.b+" "+(k.t||""),lead.t)>=3)return;let bn=null,bs=1;news.forEach(n=>{if(!okPick(n))return;const v=sim(k.b+" "+(k.t||""),n.t+" "+(n.p||""));if(v>bs){bs=v;bn=n}});if(bn)picks.push(bn)});
 for(const [k] of CATS.slice(1)){if(picks.length>=3)break;const n=news.find(x=>x.c===k&&okPick(x));if(n)picks.push(n)}
 for(const n of news){if(picks.length>=3)break;if(okPick(n))picks.push(n)}
 const catName=Object.fromEntries(CATS);
 const src=n=>n.s&&n.s[0]?`${esc(n.s[0][0])} · ${esc(n.s[0][1])}`:"";
 const link=(n,cls,label)=>n.s&&n.s[0]?orig(n.s[0][2],n.s[0][0],n.t,`<span class="${cls}">${label}</span>`):`<span class="${cls}">${label}</span>`;
 const cols=CATS.slice(1).map(([k,name])=>{
  const its=news.filter(n=>n.c===k);
  if(!its.length)return `<div class="fcol"><h3>${name}</h3><p class="fnone">오늘은 새 기사가 없어요.</p></div>`;
  const [f,...rest]=its;
  return `<div class="fcol"><h3>${name}</h3><div class="ftop">${link(f,"fh",esc(f.t))}<p class="fsum">${esc(f.p)}</p><span class="fsrc">${src(f)}</span></div>${rest.map(n=>link(n,"fl",esc(n.t))).join("")}</div>`;
 }).join("");
 const A=D.aa||{},aaT=A.today||[];
 const aa=`<div class="faa"><b>AA아키그룹 소식</b>${aaT.length?aaT.slice(0,2).map(x=>orig(x.u,"AA아키그룹 관련 보도",x.t,`<span>${esc(x.t)}</span>`)).join(""):`<span>오늘은 새로 보도된 소식이 없어요.</span>`}<a class="fmore" href="#aa">AA 소식 모아보기 →</a></div>`;
 const N=(P.notices||[]).slice(0,4);
 const ps=`<h3>프로젝트 서울 공모알림</h3>${N.length?N.map(x=>`<a class="fps" href="${url(x.u)}" target="_blank" rel="noopener"><small>${esc(String(x.d).slice(5))} · ${esc(x.c)}</small>${esc(x.t)}</a>`).join(""):`<p class="fnone">불러온 알림이 없어요.</p>`}<a class="fmore" href="#ps">공고·아카이브 전체 →</a>`;
 const cal=(D.cal||[]).slice(0,3);
 const calH=cal.length?`<h3>다가오는 일정</h3>${cal.map(r=>`<p class="fcal"><b>${esc(r[0])}</b> ${esc(r[1])}</p>`).join("")}`:"";
 main.innerHTML=`<div class="front">
 <div class="fmain">
  <article class="flead">
   <div class="fleadL"><span class="fkick">머리기사 · ${esc(catName[lead.c]||"")}</span>${link(lead,"fH",esc(lead.t))}<p class="fleadP">${esc(lead.p)}</p><span class="fsrc">${src(lead)}</span></div>
   <div class="fkey"><b>핵심 뉴스</b>${picks.map((n,i)=>`<p><b class="n">${i+1}</b> ${link(n,"fk",esc(n.t))} <span class="fkc">${esc(catName[n.c]||"")}</span></p>`).join("")}<a class="fmore" href="#today">오늘 브리핑 전체(요약 포함) →</a></div>
  </article>
  <div class="fcols">${cols}</div>
 </div>
 <aside class="fside">${aa}${ps}${calH}</aside>
</div>`;
}

/* ---------- 날짜별 브리핑 ---------- */
function dayView(D){
 const cal=(D.cal||[]).length?`<section class="cal"><h2>이번 주·다가오는 일정</h2><table><tbody>${D.cal.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></section>`:"";
 main.innerHTML=`<div class="dv"><div class="dvL pane"><section class="top"><div><h2>오늘의 핵심</h2>${keyHTML(D)}</div>${numsHTML(D)}</section>${aaHTML(D)}${cal}</div>
 <div class="dvR pane"><nav class="filters" id="filters" aria-label="분야 필터">${filtersHTML(D)}</nav><div class="grid${cur==="all"?"":" one"}" id="grid">${newsHTML(D)}</div></div></div>`;
 document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;try{localStorage.setItem("brief-cat",cur)}catch(err){}
  document.getElementById("filters").innerHTML=filtersHTML(D);const gr=document.getElementById("grid");gr.className="grid"+(cur==="all"?"":" one");gr.innerHTML=newsHTML(D)});
}

/* ---------- AA 소식 ---------- */
async function aaView(){
 dnav.style.display="none";dl.textContent="AA아키그룹 관련 보도 모아보기";
 main.innerHTML=`<p class="msg">불러오는 중입니다.</p>`;
 const days=IDX.slice(0,90);
 const all=await Promise.all(days.map(x=>getDay(x.date).catch(()=>null)));
 const seen=new Set(),items=[];
 all.forEach(D=>{if(!D)return;const A=D.aa||{};[...(A.today||[]),...(A.recent||[])].forEach(x=>{const u=x&&x.u;if(!u||seen.has(u))return;seen.add(u);items.push(x)})});
 items.sort((a,b)=>String(b.d||"").localeCompare(String(a.d||"")));
 const latest=all.find(Boolean),sig=latest&&latest.aa&&latest.aa.signal;
 main.innerHTML=`<section class="aav"><h2>AA아키그룹 소식</h2><p class="lbl">매일 브리핑에서 찾은 회사 관련 보도를 날짜순으로 모았어요. 제목을 누르면 원문이 열려요.</p>
 ${sig?`<p class="sig" style="padding:10px 12px;background:var(--panel)"><b>최근 시장 신호</b> · ${esc(sig)}</p>`:""}
 ${items.length?`<ul class="list pane">${items.map(x=>`<li><time>${esc(x.d)}</time><div><b>${orig(x.u,"AA아키그룹 관련 보도",x.t,esc(x.t))}</b>${x.p?`<span class="lbl">${esc(x.p)}</span>`:""}</div></li>`).join("")}</ul>`:`<p class="msg">아직 모인 보도가 없습니다.</p>`}
 <div class="links"><a class="btn" href="https://www.aaarchigroup.com/news" target="_blank" rel="noopener">회사 뉴스룸 바로가기 ↗</a></div></section>`;
}

/* ---------- 프로젝트 서울 ---------- */
const PS="https://project.seoul.go.kr";
async function psView(){
 dnav.style.display="none";dl.textContent="서울시 공공건축 설계공모 (프로젝트 서울)";
 main.innerHTML=`<p class="msg">불러오는 중입니다.</p>`;
 let P={};try{const r=await fetch("data/project_seoul.json",{cache:"no-store"});if(r.ok)P=await r.json()}catch(e){}
 const ext=(u,label)=>`<a class="btn" href="${url(u)}" target="_blank" rel="noopener">${label} ↗</a>`;
 const N=P.notices||[],A=P.results||[];
 main.innerHTML=`<section class="psv"><h2>프로젝트 서울</h2>
 <p class="lbl">서울시 설계공모 통합 누리집의 공모알림과 Competitions의 공모 결과를 매일 아침 모아 와요.${P.updated?` 마지막 갱신 ${esc(P.updated)}.`:""} 프로젝트 서울은 다른 사이트 안에서 열리지 않게 설정돼 있어서, 항목을 누르면 새 탭으로 열려요.</p>
 <div class="links">${ext(PS+"/view/viewListCptt.do?stage=open","진행 중 공고")}${ext(PS+"/view/viewListCptt.do?stage=review","심사")}${ext(PS+"/view/viewListCptt.do?stage=results","결과")}${ext(PS+"/view/viewListArchive.do","설계·건설 아카이브")}${ext(PS+"/view/viewListArchive.do?tab=award","서울시건축상")}</div>
 <div class="psg"><div class="pane"><h3>공모알림</h3>
 ${N.length?`<ul class="nl">${N.map(x=>`<li><a href="${url(x.u)}" target="_blank" rel="noopener"><time>${esc(x.d)}</time><span><small>${esc(x.c)}</small><b>${esc(x.t)}</b></span></a></li>`).join("")}</ul>`:`<p class="msg">아직 가져온 공모알림이 없습니다.</p>`}</div>
 <div class="pane"><h3>공모 결과</h3>
 ${A.length?`<div class="arcg res">${A.map(x=>{const u=/viewDetailCptt/.test(x.u)&&!x.u.includes("#")?x.u+"#submissions":x.u;
  return `<a href="${url(u)}" target="_blank" rel="noopener" title="당선작 보기">${x.img?`<img src="${url(x.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<i></i>`}<span class="tx"><span class="st">${esc(x.stage)}</span><b>${esc(x.t)}</b><span>${esc(x.meta)}</span></span></a>`}).join("")}</div>`:`<p class="msg">공모 결과를 아직 가져오지 못했어요. 내일 아침 갱신 때 채워집니다.</p>`}</div></div>
 </section>`;
}

/* ---------- 지난 브리핑 ---------- */
function arcView(q=""){
 dl.textContent=`보관된 브리핑 ${IDX.length}일치`;dnav.style.display="none";
 const ql=q.trim().toLowerCase();
 const list=IDX.filter(x=>!ql||(x.head+x.date).toLowerCase().includes(ql));
 const byM={};list.forEach(x=>{const m=x.date.slice(0,7);(byM[m]=byM[m]||[]).push(x)});
 const body=Object.keys(byM).sort().reverse().map(m=>`<div class="mon">${+m.slice(0,4)}년 ${+m.slice(5)}월</div>${byM[m].map(dayRow).join("")}`).join("");
 main.innerHTML=`<section class="arc"><h2>지난 브리핑</h2><div class="tools"><label for="q" class="lbl">제목으로 찾기</label><input id="q" type="search" placeholder="예: 목동, 희림, LH" value="${esc(q)}"></div><div class="arcl pane">${body||`<p class="msg">찾는 브리핑이 없습니다.</p>`}</div></section>`;
 const qi=document.getElementById("q");qi.addEventListener("input",()=>{const p=qi.selectionStart;arcView(qi.value);const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)});
}

/* ---------- 원문 열람 창 ---------- */
const reader=document.getElementById("reader"),rFrame=document.getElementById("rFrame"),rOpen=document.getElementById("rOpen");
let lastFocus=null;
function openReader(u,src,ttl){
 lastFocus=document.activeElement;
 document.getElementById("rTitle").firstChild.nodeValue=ttl||"원문";
 document.getElementById("rSrc").textContent=src||"";
 rOpen.href=u;rFrame.src=u;
 reader.classList.add("open");reader.setAttribute("aria-hidden","false");document.body.classList.add("reading");
 rOpen.focus();
}
function closeReader(){
 reader.classList.remove("open");reader.setAttribute("aria-hidden","true");document.body.classList.remove("reading");
 rFrame.src="about:blank";if(lastFocus)lastFocus.focus();
}
document.addEventListener("click",e=>{
 const card=e.target.closest(".item");
 if(card&&!e.target.closest("a")){const f=card.querySelector("a.orig");if(f){if(noFrame(f.href))window.open(f.href,"_blank","noopener");else openReader(f.href,f.dataset.src,f.dataset.ttl);return}}
 const a=e.target.closest("a.orig");
 if(a&&/^https?:/.test(a.getAttribute("href"))&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!noFrame(a.href)){e.preventDefault();openReader(a.href,a.dataset.src,a.dataset.ttl);return}
 if(e.target.closest("[data-close]"))closeReader();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&reader.classList.contains("open"))closeReader()});

/* ---------- 라우팅 ---------- */
function setTab(id){["vHome","vToday","vAA","vPS","vArc"].forEach(t=>{const el=document.getElementById(t);if(t===id)el.setAttribute("aria-current","page");else el.removeAttribute("aria-current")})}
async function route(){
 const h=location.hash.slice(1);
 document.body.classList.add("fit");
 if(h==="archive"){setTab("vArc");arcView();return}
 if(h==="aa"){setTab("vAA");await aaView();return}
 if(h==="ps"){setTab("vPS");await psView();return}
 if(h===""||h==="home"){setTab("vHome");await homeView();return}
 setTab("vToday");
 const want=h.startsWith("d-")?h.slice(2):null;
 const d=(want&&IDX.some(x=>x.date===want))?want:IDX[0]?.date;
 if(!d){main.innerHTML=`<p class="msg">아직 발행된 브리핑이 없습니다.</p>`;return}
 dnav.style.display="";const i=IDX.findIndex(x=>x.date===d);
 prev.disabled=i>=IDX.length-1;next.disabled=i<=0;shown=i;
 try{const D=await getDay(d);dl.textContent=fmt(D.date,D.weekday)+(i===0?" · 최신호":"");dayView(D);window.scrollTo(0,0)}
 catch(e){main.innerHTML=`<p class="msg">${esc(d)} 브리핑을 불러오지 못했습니다.</p>`}
}
prev.addEventListener("click",()=>{if(shown<IDX.length-1)location.hash="d-"+IDX[shown+1].date});
next.addEventListener("click",()=>{if(shown>0)location.hash=shown-1===0?"today":"d-"+IDX[shown-1].date});
window.addEventListener("hashchange",route);
fetch("data/index.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{IDX=(Array.isArray(j)?j:[]).sort((a,b)=>a.date<b.date?1:-1);route()})
 .catch(()=>{main.innerHTML=`<p class="msg">브리핑 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>`});
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건설·건축 데일리 브리핑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; background: #fff; color: #111; line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-bottom: 3px solid #111; padding-bottom: 16px; margin-bottom: 24px; }
  .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .tag { background: #d62f2f; color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; display: inline-block; }
  .tabs button, .nav button, .filters button {
    border: 1px solid #ccc; background: #fff; padding: 8px 14px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .tabs button.active, .filters button.active { background: #111; color: #fff; border-color: #111; }
  .nav { display: flex; gap: 8px; }
  .nav button:disabled { color: #bbb; cursor: default; }
  h1 { font-family: "Nanum Myeongjo", serif; font-size: 40px; margin: 12px 0 8px; }
  .meta { font-size: 13px; color: #666; }
  .grid-top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-bottom: 32px; }
  h2 { font-size: 22px; margin-bottom: 12px; }
  .key li { list-style: none; display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #ddd; }
  .key li:first-child { padding-top: 0; }
  .key .num { color: #d62f2f; font-weight: 700; font-size: 18px; }
  .stat { background: #e6ecef; padding: 20px; }
  .stat .big { font-size: 48px; font-weight: 800; }
  .bar { background: #fff; height: 12px; margin: 8px 0; position: relative; }
  .bar div { background: #3a6b8a; height: 100%; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
  .card { border-top: 1px solid #ddd; padding: 16px 0; }
  .card h3 { font-size: 17px; margin-bottom: 8px; font-family: "Nanum Myeongjo", serif; }
  .card p { font-size: 14px; color: #333; margin-bottom: 8px; }
  .card .src { font-size: 12px; color: #777; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card a.orig { color: #333; text-decoration: underline; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .empty { color: #777; padding: 24px 0; }
  .footer { margin-top: 40px; border-top: 2px solid #111; padding-top: 12px; font-size: 12px; color: #777; }
  @media (max-width: 760px) {
    .grid-top, .cards { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <span class="tag">사내 공유용</span>
      <div class="tabs">
        <button id="btnToday" class="active">오늘 브리핑</button>
        <button id="btnPrev">지난 브리핑</button>
      </div>
    </div>
    <h1>건설·건축 데일리 브리핑</h1>
    <div class="top">
      <div class="meta" id="dateMeta"></div>
      <div class="nav">
        <button id="navPrev">← 이전 날</button>
        <button id="navNext">다음 날 →</button>
      </div>
    </div>
  </header>

  <section class="grid-top">
    <div>
      <h2>오늘의 핵심</h2>
      <ol class="key" id="keyList"></ol>
    </div>
    <div class="stat" id="statBox"></div>
  </section>

  <h2>기사</h2>
  <div class="filters" id="filters"></div>
  <div class="cards" id="cards"></

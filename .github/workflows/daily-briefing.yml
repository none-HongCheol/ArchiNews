name: 데일리 브리핑 발행

on:
  schedule:
    # 매일 07:10 한국시간(= 전날 22:10 UTC)에 시작 → 07:30 전후 발행
    # GitHub 서버가 붐비면 몇 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "10 22 * * *"
  workflow_dispatch:   # Actions 화면에서 '지금 실행' 버튼으로 수동 실행
    inputs:
      date:
        description: "날짜(YYYY-MM-DD). 비우면 오늘"
        required: false
      only:
        description: "project_seoul 을 넣으면 프로젝트 서울 목록만 갱신(AI 사용 안 함)"
        required: false

permissions:
  contents: write   # 이 저장소에만 새 브리핑 파일을 올릴 권한

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브리핑 생성 (회사 Open WebUI)
        env:
          BRIEFING_BACKEND: ${{ vars.BRIEFING_BACKEND || 'openwebui' }}
          OPENWEBUI_URL: ${{ vars.OPENWEBUI_URL || 'https://ai.aaarchigroup-ai.com' }}
          OPENWEBUI_MODEL: ${{ vars.OPENWEBUI_MODEL }}
          OPENWEBUI_API_KEY: ${{ secrets.OPENWEBUI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          BRIEFING_DATE: ${{ github.event.inputs.date }}
          BRIEFING_ONLY: ${{ github.event.inputs.only }}
        run: python scripts/make_briefing.py

      - name: 사이트에 반영 (커밋·푸시)
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

name: daily-briefing
on:
  schedule:
    - cron: "30 22 * * *"   # 한국시간 매일 07:30
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_briefing.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/briefings.json
          git commit -m "daily update" || echo "변경 없음"
          git push
